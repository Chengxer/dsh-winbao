<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DSH Desktop — 开箱即用的 DeepSeek Harness 桌面客户端</title>
<meta name="description" content="DSH Desktop 把 @deepseek-ai/dsh 封装为开箱即用的 Windows 桌面客户端：内置 dsh CLI 与 Node 运行时，免装 Node，一键启动 Web UI。" />
<!-- Pages 根入口：自动跳转到正式宣发页 landing/，保留锚点（如 #download）。 -->
<meta http-equiv="refresh" content="0; url=landing/" />
<link rel="canonical" href="landing/" />
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
    background: radial-gradient(1200px 600px at 50% -10%, #1b2a6b 0%, #0b1220 55%);
    color: #e6ecff; font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
  }
  .logo { width: 64px; height: 64px; border-radius: 16px; }
  p { font-size: 14px; color: #93a5d8; }
  a { color: #5b8cff; }
  .spin { width: 30px; height: 30px; border: 3px solid rgba(122,150,255,0.25); border-top-color: #5b8cff; border-radius: 50%; animation: sp 0.8s linear infinite; }
  @keyframes sp { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <svg class="logo" viewBox="0 0 64 64" aria-hidden="true">
    <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5b8cff"/><stop offset="1" stop-color="#38e0ff"/></linearGradient></defs>
    <rect width="64" height="64" rx="16" fill="url(#g)"/>
    <path d="M22 18h12a12 12 0 0 1 0 24H22z" fill="none" stroke="#fff" stroke-width="5" stroke-linejoin="round"/>
  </svg>
  <div class="spin"></div>
  <p>正在打开 DSH Desktop 宣发页…</p>
  <p style="font-size:13px;color:#5f6f9c">若未自动跳转，<a href="landing/">点这里</a></p>
  <script>
    try { location.replace('landing/' + (location.hash || '')); } catch (e) {}
  </script>
</body>
</html>
