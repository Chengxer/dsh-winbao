name: Release Build

# 推 tag（v*，如 v0.4.0）时自动在云端构建 Windows 安装包并上传到 GitHub Release。
# 用法：git tag v0.4.0 && git push origin v0.4.0（push gitee v0.4.0 同步 tag）
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: dsh-desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: dsh-desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      # vendor/ 不进 git（.gitignore 排除），构建前用 runner 自带的 Node 24 现场生成：
      # fetch-node 复制 node.exe、fetch-npm 复制随 Node 分发的 npm CLI。
      # 注意：npm ci 的 native modules（sharp/node-pty/koffi）也针对 Node 24 ABI 编译，
      # 与复制的 node.exe 同版本，保证打包后 ABI 匹配。
      - name: Fetch runtime (vendor/node + vendor/npm)
        run: |
          npm run fetch-node
          npm run fetch-npm

      - name: Build (portable + nsis)
        run: npm run dist
        env:
          # 无代码签名证书：禁止自动发现 Windows 证书，避免构建机上有证书时报错或误签
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Publish to GitHub Release
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          gh release view $tag --json id 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "DSH Desktop $tag" --generate-notes
          }
          gh release upload $tag dist/DSH-Desktop-*.exe dist/DSH-Desktop-*.blockmap --clobber
          Write-Output '=== release assets ==='
          gh release view $tag --json assets --jq '.assets[].name'
        env:
          GH_TOKEN: ${{ github.token }}
