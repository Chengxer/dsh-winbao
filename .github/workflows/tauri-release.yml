          cp -r dsh-desktop/scripts "$DEST/scripts"
          cp -r dsh-desktop/assets "$DEST/assets"
          mkdir -p "$DEST/vendor"
          cp -r dsh-desktop/vendor/node "$DEST/vendor/node"
          cp -r dsh-desktop/vendor/npm "$DEST/vendor/npm" 2>/dev/null || true
          rm -rf "$DEST/node_modules"
          cp -r dsh-desktop/node_modules "$DEST/node_modules"
          rm -rf "$DEST/node_modules/electron" "$DEST/node_modules/electron-builder" "$DEST/node_modules/electron-winstaller" "$DEST/node_modules/@electron"
          echo "Payload: $(du -sm "$DEST" | cut -f1)MB"

      - name: Build installer
        # --bundles dmg：同 Linux——覆盖 targets:["nsis"]，否则 macOS 不出 dmg
        run: cd dsh-tauri && npx --yes @tauri-apps/cli@latest build --config src-tauri/src/app/tauri.conf.json --target aarch64-apple-darwin --bundles dmg

      - name: Verify ad-hoc signature (arm64 内核强制代码签名)
        # v0.5.0 事故复盘：Tauri v2 在未配置 signingIdentity 且无 APPLE_CERTIFICATE
        # 时【完全跳过】codesign——.app 无 bundle 级密封（_CodeSignature 缺失），
        # 仅主二进制带 rustc/ld 链接期 ad-hoc 签名。Sequoia 起 Gatekeeper 对
        # quarantine 的此类应用直接报「已损坏」，xattr -cr 救不回。
        # 修复：tauri.conf.json 已显式 signingIdentity:"-"（ad-hoc），由 Tauri
        # 在打 DMG 前按由内向外顺序正规签名；本步骤验证签名真实存在，失败即
        # 回退显式重签并重打 DMG——绝不再发出无签名 mac 包。
        run: |
          set -e
          # 注意：Tauri 打完 DMG 会「Cleaning」删掉 bundle/macos/ 下的 .app
          # （v0.5.1 首跑实测：验已被清理的路径必假失败）——改为挂载 DMG 验
          # 内层 app；失败才解包重签重打。
          DMG_DIR="dsh-tauri/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg"
          DMG="$(ls "$DMG_DIR"/*.dmg | head -1)"
          [ -f "$DMG" ] || { echo "::error::未找到 DMG 产物（构建失败？）"; ls -la "$DMG_DIR" || true; exit 1; }
          MNT="$(mktemp -d)/dshd"
          hdiutil attach "$DMG" -mountpoint "$MNT" -nobrowse -readonly -quiet
          APP="$MNT/DSH Desktop.app"
          echo "=== codesign -dv（DMG 内层）==="
          codesign -dv "$APP" 2>&1 || true
          if codesign --verify --deep --strict "$APP"; then
            echo "OK: DMG 内 app bundle 签名有效（ad-hoc 密封完整）"
          else
            echo "::warning::签名缺失/无效——解包重签并重打 DMG"
            WORK="$(mktemp -d)"
            cp -R "$APP" "$WORK/DSH Desktop.app"
            hdiutil detach "$MNT" -quiet || true
            xattr -cr "$WORK/DSH Desktop.app" || true
            codesign --force --deep --sign - "$WORK/DSH Desktop.app"
            codesign --verify --deep --strict "$WORK/DSH Desktop.app"
            rm -f "$DMG_DIR"/*.dmg
            hdiutil create -volname "DSH Desktop" -srcfolder "$WORK/DSH Desktop.app" -ov -format UDZO "$DMG_DIR/resigned.dmg"
            MNT="$(mktemp -d)/dshd2"
            hdiutil attach "$DMG_DIR/resigned.dmg" -mountpoint "$MNT" -nobrowse -readonly -quiet
            APP="$MNT/DSH Desktop.app"
          fi
          echo "=== spctl 评估（ad-hoc 必然 rejected，仅留痕）==="
          spctl -a -t execute "$APP" 2>&1 || true
          hdiutil detach "$MNT" -quiet || true

      - name: Rename artifacts (assert version + size)
        run: |
          set -euo pipefail
          VERSION=${{ steps.ver.outputs.version }}
          BUNDLE=dsh-tauri/src-tauri/target/aarch64-apple-darwin/release/bundle
          # 版本混装防线③（v0.5.0 事故的直接防线）：DMG 内 Info.plist 的
          # CFBundleShortVersionString 必须等于期望版本。.app 已被 Tauri 打
          # DMG 后清理——挂载 DMG 读内层 plist（与签名校验步骤同款姿势）。
          DMG="$(ls "$BUNDLE"/dmg/*.dmg | head -1)"
          [ -f "$DMG" ] || { echo "::error::未找到 DMG 产物"; exit 1; }
          MNT="$(mktemp -d)/dshd"
          hdiutil attach "$DMG" -mountpoint "$MNT" -nobrowse -readonly -quiet
          plist_ver=$(plutil -extract CFBundleShortVersionString raw "$MNT/DSH Desktop.app/Contents/Info.plist")
          hdiutil detach "$MNT" -quiet || true
          echo "Info.plist CFBundleShortVersionString = ${plist_ver}"
          if [ "$plist_ver" != "$VERSION" ]; then
            echo "::error::DMG 内 Info.plist 版本 ${plist_ver} != 期望 ${VERSION}（版本混装）"
            exit 1
          fi
          ls -la "$BUNDLE/dmg" || true
          shopt -s nullglob
          dmgs=( "$BUNDLE"/dmg/*_"${VERSION}"_*.dmg )
          # 签名回退路径重打的 DMG 文件名不带版本（resigned.dmg）——内容版本
          # 已由上方 Info.plist 断言覆盖，允许兜底匹配
          if [ ${#dmgs[@]} -eq 0 ] && [ -f "$BUNDLE/dmg/resigned.dmg" ]; then
            dmgs=( "$BUNDLE/dmg/resigned.dmg" )
          fi
          if [ ${#dmgs[@]} -eq 0 ]; then
            echo "::error::未找到 *_${VERSION}_*.dmg——DMG 文件名版本与期望不符（见上方目录清单）"
            exit 1
          fi
          cp "${dmgs[0]}" "DSH-Desktop-${VERSION}-macos-arm64.dmg"
          # BSD stat（macOS）无 -c——用 wc -c 全平台可移植（此行是 v0.5.1
          # 第三跑才暴露的陈年坑：此前从未活到这一步）。
          size=$(wc -c < "DSH-Desktop-${VERSION}-macos-arm64.dmg" | tr -d ' ')
          if [ "$size" -lt 52428800 ]; then
            echo "::error::DMG 体积异常（${size} 字节 < 50MB；v0.5.0 参考：~117MB）"
            exit 1
          fi
          echo "OK: DSH-Desktop-${VERSION}-macos-arm64.dmg ($size bytes)"
          ls -la DSH-Desktop-*-macos-arm64.dmg

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: DSH-Desktop-*-macos-arm64.dmg
          if-no-files-found: warn

  publish:
    name: Publish Release
    needs: [build-windows, build-windows-arm64, build-portable, build-linux, build-macos]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: always() && !cancelled() && (needs.build-windows.result == 'success' || needs.build-portable.result == 'success' || needs.build-linux.result == 'success' || needs.build-macos.result == 'success' || needs.build-windows-arm64.result == 'success')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect installers
        run: |
          set -euo pipefail
          mkdir -p release-assets
          # 全部发布产物（含便携版 zip）；排除中间产物（win-x64-bin 里的裸 exe，
          # 它只是便携版 job 的原料，不进 Release）
          find artifacts -type f \( -name "*.exe" -o -name "*.zip" -o -name "*.AppImage" -o -name "*.deb" -o -name "*.dmg" \) ! -name "dsh-tauri-app.exe" -exec cp {} release-assets/ \; || true
          if [ -z "$(ls -A release-assets)" ]; then
            echo "::error::没有任何构建产物被收集（所有 build job 均失败？）——中止发布"
            exit 1
          fi

      - name: Resolve release tag/version
        id: ver
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            tag='${{ github.event.inputs.version }}'
            case "$tag" in v*) ;; *) tag="v$tag" ;; esac
          else
            tag='${{ github.ref_name }}'
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Verify assets (版本一致 + 体积下限)
        # 版本混装防线④（最后一道闸）：每个资产文件名必须内嵌期望版本号、
        # 体积必须 >50MB。任一不满足即拒绝发布——上游 job 有 continue-on-error，
        # 不能全信，publish 是资产出仓前的总闸。
        run: |
          set -euo pipefail
          VERSION='${{ steps.ver.outputs.version }}'
          echo "=== 产物清单（期望版本 ${VERSION}）==="
          fail=0
          for f in release-assets/*; do
            name=$(basename "$f")
            case "$name" in
              *"$VERSION"*) ;;
              *) echo "::error::资产文件名未包含期望版本 ${VERSION}: $name（版本混装？拒绝发布）"; fail=1 ;;
            esac
            size=$(stat -c%s "$f")
            if [ "$size" -lt 52428800 ]; then
              echo "::error::资产体积异常（<50MB）: $name（${size} 字节）"
              fail=1
            fi
            printf '%-48s %12d bytes\n' "$name" "$size"
          done
          [ "$fail" -eq 0 ] || exit 1
          echo "OK: $(ls release-assets | wc -l) 个资产全部通过版本/体积校验"

      - name: Generate release notes
        run: |
          TAG='${{ steps.ver.outputs.tag }}'
          VERSION='${{ steps.ver.outputs.version }}'
          cat > release-notes.md << EOF
          # DSH Desktop ${VERSION} — Tauri 2

          ## 安装包

          | 平台 | 格式 |
          |------|------|
          | Windows x64 | 安装包 DSH-Desktop-Setup-${VERSION}-win-x64.exe |
          | Windows x64 | 便携版 DSH-Desktop-Portable-${VERSION}-win-x64.zip（解压即用，数据存 exe 旁 data/ 目录） |
          | Windows ARM64 | 实验性安装包 DSH-Desktop-Setup-${VERSION}-win-arm64.exe |
          | Linux x64 | AppImage / .deb |
          | macOS ARM64 | .dmg |

          ## 升级说明

          1. 完全退出当前 DSH Desktop（托盘右键 → 退出）
          2. 下载对应平台安装包并运行
          3. 安装器自动检测旧版并装回原目录（数据不丢失）
          4. 首次启动自动同步全部插件与设置

          ## 详细更新日志

          见 [CHANGELOG.md](https://github.com/myYangyunfan/dsh_desktop/blob/tauri/modular/dsh-tauri/CHANGELOG.md)
          EOF

      - name: Upload assets to Release
        # 上传纪律：
        #  1) release 不存在时才创建；已存在时绝不触碰 title/body/prerelease/draft
        #     ——此前 softprops/action-gh-release 每次运行都会把 Pre-release 和
        #     预览版标题冲掉（draft:false + prerelease:false 写死）。
        #  2) 同名资产先 delete-asset 再上传（而非 fail-fast）：「给已发布版本
        #     补传/重建资产」正是 workflow_dispatch 的第一用途，fail-fast 会让
        #     该用途无法执行；显式删除后重传是幂等重建，且下一步会逐个核对
        #     存在性与大小，不留旧内容残影、不会出现重复资产。
        #  3) 上传失败不吞错（旧版 || echo WARN 会静默丢资产）。
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # publish job 无 checkout（无 git 上下文）——gh 必须显式知道仓库，
          # 否则 create 走「从本地 git 推断」路径直接 fatal（v0.5.1 第三跑
          # 实证：六资产校验全过、create 崩在 not a git repository）。
          GH_REPO: myYangyunfan/dsh_desktop
        run: |
          set -euo pipefail
          TAG='${{ steps.ver.outputs.tag }}'
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG 不存在——创建（仅此一次触碰 release 元数据）"
            gh release create "$TAG" --title "DSH Desktop $TAG" --notes-file release-notes.md --prerelease
          fi
          for f in release-assets/*; do
            name=$(basename "$f")
            if gh release view "$TAG" --json assets --jq '.assets[].name' | grep -Fxq "$name"; then
              echo "删除已存在的同名资产: $name"
              gh release delete-asset "$TAG" "$name" --yes
            fi
            echo "上传: $f"
            gh release upload "$TAG" "$f"
          done

      - name: Verify uploaded assets
        # 上传后校验（资产去重纪律的收口）：每个资产都在 release 上存在、
        # 大小与本地一致且非零。另列出 release 全部资产供人工核对重复。
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: myYangyunfan/dsh_desktop
        run: |
          set -euo pipefail
          TAG='${{ steps.ver.outputs.tag }}'
          gh release view "$TAG" --json assets --jq '.assets[] | "\(.name)\t\(.size)"' > remote-assets.tsv
          echo "=== release 现有资产（共 $(wc -l < remote-assets.tsv) 个）==="
          cat remote-assets.tsv
          for f in release-assets/*; do
            name=$(basename "$f")
            size=$(stat -c%s "$f")
            remote=$(awk -F'\t' -v n="$name" '$1==n {print $2}' remote-assets.tsv)
            if [ -z "$remote" ]; then
              echo "::error::资产未出现在 release 上: $name"
              exit 1
            fi
            if [ "$remote" != "$size" ]; then
              echo "::error::资产大小不一致: $name local=$size remote=$remote"
              exit 1
            fi
            echo "OK: $name ($size bytes)"
          done
          echo "=== 全部资产上传并核对通过 ==="
