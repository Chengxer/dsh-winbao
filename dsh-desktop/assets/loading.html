<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>DSH Desktop</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 28px;
    background: radial-gradient(1200px 600px at 50% -10%, #1b2a6b 0%, #0b1220 55%);
    color: #e6ecff;
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    user-select: none;
  }
  .spinner {
    width: 56px; height: 56px;
    border: 4px solid rgba(122, 150, 255, 0.25);
    border-top-color: #5b8cff;
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  h1 { font-size: 22px; font-weight: 600; letter-spacing: 0.5px; }
  p { font-size: 13px; color: #93a5d8; }
  .hint { font-size: 12px; color: #5f6f9c; }
</style>
</head>
<body>
  <div class="spinner"></div>
  <h1>DeepSeek Harness 正在启动…</h1>
  <p>正在本机启动 dsh web 服务，首次启动可能需要几十秒。</p>
  <p class="hint">DSH Desktop — 数据目录中的日志可帮助排查启动问题。</p>
</body>
</html>
