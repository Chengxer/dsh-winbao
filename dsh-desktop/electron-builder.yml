appId: com.deepseek.dsh.desktop
productName: DSH Desktop
copyright: MIT License
directories:
  output: dist
  buildResources: build

# Native modules (sharp / node-pty / koffi) are loaded by the bundled plain
# node.exe, so keep everything as real files and never rebuild for Electron.
asar: false
npmRebuild: false
buildDependenciesFromSource: false

files:
  - main.js
  - updater.js
  - session-watcher.js
  - preload.js
  - assets/**/*
  - package.json
  - "!**/*.md"

extraResources:
  - from: vendor/node/node.exe
    to: node/node.exe
  - from: vendor/npm
    to: npm

win:
  icon: build/icon.png
  target:
    - target: portable
      arch:
        - x64
    - target: nsis
      arch:
        - x64

portable:
  artifactName: DSH-Desktop-${version}-portable-${arch}.${ext}

nsis:
  artifactName: DSH-Desktop-Setup-${version}-${arch}.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: DSH Desktop
  uninstallDisplayName: DSH Desktop

publish: null
