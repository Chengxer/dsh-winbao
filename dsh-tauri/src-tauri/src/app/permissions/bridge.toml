# DSH Desktop 桥 command 权限（自定义 ACL）
#
# Tauri 2 不为 app command 自动生成权限；远程页（http://127.0.0.1 内核 Web UI）
# 调用桥 command 需 capability 引用显式放行它们的权限。
# 新增 command 时同步 contracts/ipc-commands.md 与本文件。
#
# 契约溯源：contracts/ipc-commands.md §2（阶段划分）。

[[permission]]
identifier = "bridge-phase1"
description = "桥 command——Phase 1 核心生命周期"
commands.allow = [
  "app_init",
  "window_control",
  "menu_action",
  "copy_text",
  "open_external",
  "page_error",
  "renderer_heartbeat",
  "current_session",
  "restart_service",
  "recovery_state",
  "recovery_reload",
  "recovery_restart",
  "recovery_open_logs",
  "sponsor_window",
  "float_window",
  "float_close",
]

[[permission]]
identifier = "bridge-phase2"
description = "桥 command——Phase 2 sidecar 全链路（插件管理）"
commands.allow = [
  "plugin_list",
  "plugin_set_enabled",
  "plugin_uninstall",
  "plugin_restore",
  "plugin_check_updates",
  "plugin_update",
]

[[permission]]
identifier = "bridge-phase3"
description = "桥 command——Phase 3 围栏/诊断/备份/WSL/宠物窗"
commands.allow = [
  "file_revert",
  "file_open",
  "image_paste_save",
  "balance_refresh",
  "diag_run",
  "diag_export",
  "diag_validate",
  "diag_order",
  "diag_order_apply",
  "diag_remove_bundle",
  "backup_export",
  "backup_restore",
  "wsl_config_get",
  "wsl_config_save",
  "wsl_recheck",
  "pet_window",
  "pet_close",
  "pet_move_to",
  "pet_set_auto_open",
  "sponsor_qr",
]
