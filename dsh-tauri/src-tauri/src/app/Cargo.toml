[package]
name = "dsh-tauri-app"
description = "DSH Desktop Tauri 装配根：窗口壳 + 桥 command 注册（Phase 0 = PoC-A/B 载体）"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { workspace = true }
serde_json = { workspace = true }
bridge = { path = "../../crates/bridge" }
kernel-process = { path = "../../crates/kernel-process" }
preview-server = { path = "../../crates/preview-server" }
shell-core = { path = "../../crates/shell-core" }

[features]
default = []
