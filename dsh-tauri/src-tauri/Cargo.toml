[workspace]
resolver = "2"
members = [
    "crates/shell-core",
    "crates/kernel-process",
    "crates/bridge",
    "crates/fence",
    "crates/preview-server",
    "crates/session-watcher",
    "crates/sidecar-orchestrator",
    "pocs/poc-sidecar-spawn",
    "src/app",
]

[workspace.package]
version = "0.5.0"
edition = "2021"
license = "MIT"
authors = ["myYangyunfan"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
