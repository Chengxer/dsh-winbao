[workspace]
resolver = "2"
members = [
    "crates/shell-core",
    "crates/kernel-process",
    "crates/bridge",
    "crates/fence",
    "crates/preview-server",
    # 通知限流/聚焦豁免决策逻辑（Phase 3 通知链接线目标；当前零消费者，
    # 保留为已测纯逻辑储备——见 migration-roadmap Phase 3）。
    "crates/session-watcher",
    "pocs/poc-sidecar-spawn",
    "src/app",
]

[workspace.package]
version = "0.5.2"
edition = "2021"
license = "MIT"
authors = ["myYangyunfan"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
